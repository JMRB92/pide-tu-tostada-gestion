      - name: Instalar dependencias
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tostada-tests"
          npm install --no-audit --no-fund
      - name: Pruebas completas (reglas candidatas)
        id: validacion
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tostada-tests"
          npm test
          npm run test:rules
      - name: Diagnóstico aislado si fallan las pruebas
        if: ${{ failure() && steps.validacion.outcome == 'failure' }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tostada-tests"
          npx firebase emulators:exec --project demo-tostada --only firestore "bash diagnose.sh"
